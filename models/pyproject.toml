[project]
name = "credlayer-ml"
version = "0.1.0"
description = "CredLayer standalone GNN fraud detection and reputation scoring service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "torch>=2.3",
    "torch-geometric>=2.5",
    "polars>=1.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "requests>=2.32",
    "huggingface-hub>=0.23",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credlayer_ml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
