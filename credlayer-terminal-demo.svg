<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    
    @keyframes typeWriter {
      from { width: 0; }
      to { width: 100%; }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    @keyframes slideIn {
      from { transform: translateX(-10px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes progressBar {
      0% { width: 0; }
      100% { width: 680px; }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .terminal-bg {
      fill: #0d1117;
    }
    
    .terminal-header {
      fill: #161b22;
    }
    
    .terminal-text {
      fill: #c9d1d9;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      white-space: pre;
    }
    
    .prompt {
      fill: #58a6ff;
      font-weight: bold;
    }
    
    .success {
      fill: #3fb950;
    }
    
    .warning {
      fill: #d29922;
    }
    
    .highlight {
      fill: #79c0ff;
    }
    
    .cursor {
      fill: #58a6ff;
      animation: blink 1s infinite;
    }
    
    /* Typing effect for command */
    .cmd-wrap { 
      overflow: hidden;
      white-space: nowrap;
    }
    .cmd-text {
      animation: typeWriter 2s steps(35) 0.5s both;
    }
    
    /* Sequential appearance with delays */
    .line1 { animation: fadeIn 0.3s ease-in 2.8s both; }
    .line2 { animation: fadeIn 0.5s ease-in 3.2s both; }
    .line3 { animation: fadeIn 0.3s ease-in 3.8s both; }
    
    /* Progress bar */
    .progress-bg { animation: fadeIn 0.3s ease-in 4.2s both; }
    .progress-fill { animation: progressBar 3s ease-out 4.5s both; }
    
    /* System checks appear one by one */
    .check1 { animation: slideIn 0.5s ease-out 5s both; }
    .check2 { animation: slideIn 0.5s ease-out 5.6s both; }
    .check3 { animation: slideIn 0.5s ease-out 6.2s both; }
    .check4 { animation: slideIn 0.5s ease-out 6.8s both; }
    .check5 { animation: slideIn 0.5s ease-out 7.4s both; }
    
    /* Separator and report */
    .separator1 { animation: fadeIn 0.4s ease-in 8s both; }
    .report-title { animation: fadeIn 0.5s ease-in 8.5s both; }
    .report-line1 { animation: fadeIn 0.4s ease-in 9s both; }
    .report-line2 { animation: fadeIn 0.4s ease-in 9.5s both; }
    
    /* Score bar */
    .score-bg { animation: fadeIn 0.3s ease-in 10s both; }
    .score-fill { animation: progressBar 2s ease-out 10.3s both; }
    
    /* Metrics appear one by one */
    .metric1 { animation: slideIn 0.4s ease-out 11s both; }
    .metric2 { animation: slideIn 0.4s ease-out 11.5s both; }
    .metric3 { animation: slideIn 0.4s ease-out 12s both; }
    .metric4 { animation: slideIn 0.4s ease-out 12.5s both; }
    
    /* Final status */
    .separator2 { animation: fadeIn 0.4s ease-in 13s both; }
    .status-line { animation: slideIn 0.5s ease-out 13.5s both; }
    .tagline { animation: fadeIn 1s ease-in 14s both, pulse 3s ease-in-out 15s infinite; }
  </style>
  
  <!-- Terminal Window Background -->
  <rect class="terminal-bg" width="800" height="600" rx="8"/>
  
  <!-- Terminal Header -->
  <rect class="terminal-header" width="800" height="35" rx="8"/>
  <circle cx="20" cy="17.5" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17.5" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17.5" r="6" fill="#28c840"/>
  <text x="400" y="23" class="terminal-text" text-anchor="middle" font-size="12">credlayer@mainnet ~ %</text>
  
  <!-- Terminal Content -->
  <g transform="translate(20, 60)">
    <!-- Command Prompt with typing effect -->
    <text y="20" class="prompt">$</text>
    <g class="cmd-wrap">
      <text x="20" y="20" class="terminal-text cmd-text">credlayer init --analyze-wallet</text>
    </g>
    <rect x="295" y="8" width="10" height="16" class="cursor" style="animation-delay: 2.5s"/>
    
    <!-- Blank line -->
    <text y="50" class="terminal-text line1"> </text>
    
    <!-- Initialization message -->
    <text y="75" class="warning line2">⚡ Initializing CredLayer Intelligence Layer...</text>
    
    <!-- Progress bar container -->
    <rect x="40" y="95" width="680" height="20" fill="#21262d" rx="3" class="progress-bg"/>
    <rect x="40" y="95" width="0" height="20" fill="#58a6ff" rx="3" class="progress-fill"/>
    <text x="380" y="110" class="terminal-text line3" text-anchor="middle" font-size="12">████████████████████████████████████ 100%</text>
    
    <!-- System checks -->
    <text y="145" class="success check1">✓ Blockchain RPC Connection      → SYNCED    <tspan class="highlight">(Solana Mainnet-Beta)</tspan></text>
    
    <text y="170" class="success check2">✓ Wallet Behavior Analysis       → ACTIVE    <tspan class="highlight">(ML Model v2.1)</tspan></text>
    
    <text y="195" class="success check3">✓ On-Chain Pattern Recognition   → RUNNING   <tspan class="highlight">(3.2M wallets)</tspan></text>
    
    <text y="220" class="success check4">✓ Risk Detection Engine          → ONLINE    <tspan class="highlight">(Real-time)</tspan></text>
    
    <text y="245" class="success check5">✓ AI Reputation Scoring          → DEPLOYED  <tspan class="highlight">(Neural scoring)</tspan></text>
    
    <!-- Separator -->
    <line x1="0" y1="265" x2="760" y2="265" stroke="#30363d" stroke-width="1" class="separator1"/>
    
    <!-- Analysis Results -->
    <text y="295" class="warning report-title">📊 WALLET INTELLIGENCE REPORT</text>
    
    <text y="325" class="terminal-text report-line1">  Address: <tspan class="highlight">7xKXt...4kL9p</tspan>  Network: <tspan class="highlight">Solana</tspan></text>
    
    <!-- Score visualization -->
    <text y="355" class="terminal-text report-line2">  Reputation Score: <tspan class="success" font-weight="bold" font-size="18">842/1000</tspan> <tspan class="success">⭐ EXCELLENT</tspan></text>
    
    <!-- Score bar -->
    <rect x="40" y="370" width="400" height="15" fill="#21262d" rx="3" class="score-bg"/>
    <rect x="40" y="370" width="0" height="15" fill="#3fb950" rx="3" class="score-fill" style="width: 337px"/>
    
    <!-- Metrics -->
    <text y="410" class="terminal-text metric1">  📈 Risk Assessment:  <tspan class="success">🟢 LOW RISK</tspan></text>
    
    <text y="435" class="terminal-text metric2">  🔍 Confidence:       <tspan class="highlight">91% (High Certainty)</tspan></text>
    
    <text y="460" class="terminal-text metric3">  ⚡ Analysis Speed:    <tspan class="highlight">1.2s</tspan></text>
    
    <text y="485" class="terminal-text metric4">  🎯 Data Points:      <tspan class="highlight">847 signals processed</tspan></text>
    
    <!-- Status footer -->
    <line x1="0" y1="505" x2="760" y2="505" stroke="#30363d" stroke-width="1" class="separator2"/>
    
    <text y="530" class="success status-line">🌐 CredLayer Intelligence Layer: STATUS → ONLINE</text>
    <text y="555" class="terminal-text tagline" font-style="italic">"Not just blockchain data. Blockchain intelligence."</text>
  </g>
</svg>
