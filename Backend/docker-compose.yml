services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credlayer
      POSTGRES_PASSWORD: credlayer
      POSTGRES_DB: credlayer
    ports:
      - "5432:5432"
    volumes:
      - credlayer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credlayer"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://credlayer:credlayer@postgres:5432/credlayer
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  credlayer_postgres_data:
