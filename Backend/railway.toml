[build]
builder = "nixpacks"
buildCommand = "pip install uv && uv sync"

[deploy]
startCommand = "uv run uvicorn credlayer.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 10

[env]
ENVIRONMENT = "production"

# Note: Database tables already created via Supabase SQL Editor
# No need to run migrations on deploy
